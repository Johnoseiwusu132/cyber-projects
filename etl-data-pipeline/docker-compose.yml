services:
  postgres:
    image: postgres:16
    container_name: etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_demo}
      POSTGRES_USER: ${DB_USER:-etl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etl_password}
    ports:
      - "5432:5432"
    volumes:
      - etl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-etl_user} -d ${DB_NAME:-etl_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  etl_postgres_data:
